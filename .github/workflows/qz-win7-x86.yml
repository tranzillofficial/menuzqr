name: QZ Windows 7 x86 compatibility installer
on:
  push:
    branches: [main]
    paths:
      - installer/qz-win7*
      - .github/workflows/qz-win7-x86.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qz-win7-x86-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify official payloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/qz-win7 | Out-Null
          Invoke-WebRequest 'https://github.com/bell-sw/Liberica/releases/download/8u502%2B9/bellsoft-jre8u502%2B9-windows-i586-full.zip' -OutFile dist/qz-win7/java.zip
          Invoke-WebRequest 'https://github.com/qzind/tray/releases/download/v2.1.6/qz-tray-2.1.6%2B3.exe' -OutFile dist/qz-win7/qz-setup.exe
          if ((Get-FileHash dist/qz-win7/java.zip -Algorithm SHA256).Hash -ne 'b408a89fefe86ebc52765fc51cfe02dd17b0a94121bfe4e4951cb350e72235cd') { throw 'Java checksum mismatch' }
          if ((Get-FileHash dist/qz-win7/qz-setup.exe -Algorithm SHA256).Hash -ne '374cc06d3bd09c73c655c5f7fdfbb80904b75f852c6fec46350c2e308467cc51') { throw 'QZ checksum mismatch' }
          Expand-Archive dist/qz-win7/java.zip dist/qz-win7/extracted
          $java=Get-ChildItem dist/qz-win7/extracted -Filter java.exe -Recurse | Select-Object -First 1
          Move-Item (Split-Path (Split-Path $java.FullName)) dist/qz-win7/jre
          $version=& dist/qz-win7/jre/bin/java.exe -XshowSettings:properties -version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or $version -notmatch 'sun.arch.data.model = 32') { throw 'Not a working x86 runtime' }
          if (!(Test-Path dist/qz-win7/jre/lib/ext/jfxrt.jar)) { throw 'JavaFX runtime missing' }
      - name: Build single offline installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/qz-win7-x86.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install without system Java and test secure WebSocket
        shell: pwsh
        run: |
          $env:JAVA_HOME='C:\nonexistent-java-for-test'
          $setup=Start-Process installer/output/MenuzQR-QZ-Win7-x86-Setup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=C:\qz-wrapper.log' -PassThru
          if (!$setup.WaitForExit(180000) -or $setup.ExitCode -ne 0) { Get-Content C:\qz-wrapper.log; throw 'Offline installation failed' }
          $folder="${env:ProgramFiles(x86)}\QZ Tray"
          if (!(Test-Path "$folder\qz-tray.exe") -or !(Test-Path "$folder\jre\bin\javaw.exe")) { throw 'Installed payload missing' }
          # Launch without JAVA_HOME; QZ must discover its adjacent private jre.
          Start-Process "$folder\qz-tray.exe"
          $ready=$false
          for ($i=0;$i -lt 30;$i++) {
            try {
              $ws=[Net.WebSockets.ClientWebSocket]::new()
              $cts=[Threading.CancellationTokenSource]::new(3000)
              $ws.ConnectAsync([Uri]'wss://localhost:8181',$cts.Token).GetAwaiter().GetResult()
              $request=[Text.Encoding]::UTF8.GetBytes('{"call":"getVersion","uid":"win7-smoke","timestamp":0,"params":{}}')
              $ws.SendAsync([ArraySegment[byte]]::new($request),[Net.WebSockets.WebSocketMessageType]::Text,$true,$cts.Token).GetAwaiter().GetResult()
              $buffer=New-Object byte[] 8192
              $reply=$ws.ReceiveAsync([ArraySegment[byte]]::new($buffer),$cts.Token).GetAwaiter().GetResult()
              $message=[Text.Encoding]::UTF8.GetString($buffer,0,$reply.Count)
              if ($message -notmatch '2\.1\.6') { throw "Unexpected bridge reply: $message" }
              $ready=$true;break
            } catch { $lastError=$_; Start-Sleep -Seconds 1 }
            finally { if ($ws) {$ws.Dispose()}; if ($cts) {$cts.Dispose()} }
          }
          if (!$ready) { Get-ChildItem "$env:APPDATA\qz" -Filter '*.log' | ForEach-Object { Get-Content $_.FullName -Tail 60 }; throw "Secure WebSocket failed: $lastError" }
          $process=Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -eq "$folder\jre\bin\javaw.exe" }
          if (!$process) { throw 'QZ is not using bundled x86 Java' }
          # Verify startup was configured by the official installer.
          if (!(Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Startup" -Filter '*QZ*')) { throw 'QZ startup shortcut missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: MenuzQR-QZ-Win7-x86
          path: installer/output/MenuzQR-QZ-Win7-x86-Setup.exe
      - name: Publish compatibility package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset='installer/output/MenuzQR-QZ-Win7-x86-Setup.exe'
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + '  MenuzQR-QZ-Win7-x86-Setup.exe' | Set-Content installer/output/SHA256SUMS-QZ-Win7.txt
          gh release view qz-win7-x86-v1 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create qz-win7-x86-v1 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'MenuzQR QZ Windows 7 SP1 x86 compatibility' --notes-file installer/qz-win7-notice.txt
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload qz-win7-x86-v1 $asset installer/output/SHA256SUMS-QZ-Win7.txt --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
