name: Windows 7 compatible print installer
on:
  push:
    branches: [main]
    paths:
      - public/menuzqr-print-bridge.py
      - installer/menuzqr-print-win7.iss
      - tests/test_print_bridge.py
      - .github/workflows/print-installer-win7.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: print-installer-win7-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle official Windows 7 compatible runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/legacy | Out-Null
          Invoke-WebRequest https://www.python.org/ftp/python/3.8.10/python-3.8.10-embed-win32.zip -OutFile dist/python-3.8.10-embed-win32.zip
          Expand-Archive dist/python-3.8.10-embed-win32.zip dist/legacy
          # Deploy the supported app-local UCRT next to python.exe, so Windows 7
          # users do not have to install a separate redistributable/update.
          $ucrt = "${env:ProgramFiles(x86)}\Windows Kits\10\Redist\10.0.19041.0\ucrt\DLLs\x86"
          if (!(Test-Path "$ucrt\ucrtbase.dll")) { throw 'Windows 10 SDK 19041 x86 UCRT missing' }
          Copy-Item "$ucrt\*.dll" dist/legacy/
          Copy-Item public/menuzqr-print-bridge.py dist/legacy/
          & dist/legacy/python.exe -m unittest discover -s tests -p test_print_bridge.py
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.8 bridge tests failed' }
      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\menuzqr-print-win7.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify embedded runtime installation and startup
        shell: pwsh
        run: |
          $setup = Start-Process installer\output\MenuzQR-Print-Win7-Setup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru
          if (!$setup.WaitForExit(60000) -or $setup.ExitCode -ne 0) { throw 'Installation failed' }
          $folder = "$env:LOCALAPPDATA\Programs\MenuzQR Print"
          $exe = "$folder\pythonw.exe"
          if (!(Test-Path $exe) -or !(Test-Path "$folder\ucrtbase.dll") -or !(Test-Path "$folder\api-ms-win-crt-runtime-l1-1-0.dll")) { throw 'Embedded runtime missing' }
          $startup = Get-ItemPropertyValue 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' MenuzQRPrint
          if ($startup -ne "`"$exe`" `"$folder\menuzqr-print-bridge.py`"") { throw 'Startup registration missing' }
          $ready = $false
          for ($i=0; $i -lt 20; $i++) {
            try {
              $health = Invoke-RestMethod http://127.0.0.1:18191/health -Headers @{Origin='https://menuzqr.shop'}
              if ($health.version -eq 3) { $ready=$true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (!$ready) { throw 'Installed bridge did not start' }
          Get-Process pythonw -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe } | Stop-Process
          $uninstall = Start-Process "$folder\unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru
          if (!$uninstall.WaitForExit(60000) -or $uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name MenuzQRPrint -ErrorAction SilentlyContinue) { throw 'Startup entry was not removed' }
      - uses: actions/upload-artifact@v4
        with:
          name: MenuzQR-Print-Windows7
          path: installer/output/MenuzQR-Print-Win7-Setup.exe
      - name: Publish legacy download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset='installer/output/MenuzQR-Print-Win7-Setup.exe'
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + '  MenuzQR-Print-Win7-Setup.exe' | Set-Content installer/output/SHA256SUMS-Win7.txt
          gh release view print-win7-v3 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create print-win7-v3 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'MenuzQR Print 3 - Windows 7 compatibility' --notes 'Compatibility build for updated Windows 7 SP1, 32-bit or 64-bit, with the official Python 3.8.10 x86 embedded runtime. Includes app-local Universal C Runtime DLLs. Requires an installed ESC/POS printer driver. Installation/startup tested on Windows Server 2022; physical Windows 7 validation is still required. Both Windows 7 and Python 3.8 are end of support. Use the modern installer on Windows 10/11 x64. Not Authenticode signed.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload print-win7-v3 $asset installer/output/SHA256SUMS-Win7.txt --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
