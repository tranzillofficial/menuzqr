<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Manage Belmir — Dashboard</title><link rel="stylesheet" href="/belmir-site/style.css?v=2"><link rel="stylesheet" href="/belmir-site/dashboard.css"></head><body class="dashboard-page"><header><a class="logo" href="/belmir">Belmir<span>CAFÉ AND BAKERY</span></a><nav><a href="/belmir" target="_blank" rel="noopener">View website ↗</a><a href="/belmir/menu" target="_blank" rel="noopener">View menu ↗</a></nav></header><main class="dashboard-main"><div class="dashboard-title"><div><div class="eyebrow">YOUR BELMIR SPACE</div><h1>Make it <em>yours.</em></h1><p>Contact details, social links and your menu, all in one place.</p></div><button class="button" id="save" disabled>Save changes</button></div><div id="notice" role="status" aria-live="polite">Loading your dashboard…</div><div id="editor" hidden><section class="editor-panel"><div class="panel-title"><h2>Contact & social links</h2><span>Shown on the website and menu</span></div><div class="form-grid"><label>Phone number<input data-key="phone" type="tel" required maxlength="30"></label><label>WhatsApp number <small>Country code, digits only</small><input data-key="whatsapp" type="tel" placeholder="201154267415" maxlength="20"></label><label class="wide">Address <small>English</small><textarea data-key="address" rows="2" required maxlength="500"></textarea></label><label class="wide">Google Maps link<input data-key="mapsUrl" type="url" placeholder="https://www.google.com/maps/…" maxlength="2048"></label><label>Instagram link<input data-key="instagram" type="url" placeholder="https://www.instagram.com/…" maxlength="2048"></label><label>Facebook link<input data-key="facebook" type="url" placeholder="https://www.facebook.com/…" maxlength="2048"></label><label>Currency<input data-key="currency" maxlength="3" required></label><label>Default menu view<select data-key="defaultView"><option value="list">List</option><option value="grid">Grid</option></select></label></div></section><section class="editor-panel"><div class="panel-title"><h2>Menu collections</h2><button class="quiet" id="add-category">+ Add category</button></div><div class="category-picker"><label>Choose a category<select id="category-select"></select></label><span id="menu-count"></span></div><div id="category-editor"></div></section></div></main><script src="/belmir-site/common.js"></script><script src="/belmir-site/dashboard.js"></script></body></html>
